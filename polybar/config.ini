[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
foreground-alt = #a9b1d6

primary = #7aa2f7
secondary = #bb9af7
accent = #7dcfff

red = #f7768e
orange = #ff9e64
yellow = #e0af68
green = #9ece6a
cyan = #7dcfff
blue = #7aa2f7
purple = #bb9af7
teal = #73daca

disabled = #565f89
border = #3b4261

[bar/bar]
width = 100%
height = 22pt
radius = 6

; dpi = 96

background = ${colors.background-alt}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.background-alt}

font-0 = Iosevka Nerd Font;2

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio xkeyboard memory cpu temperature wireless-network date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
pin-workspaces = true
label-occupied = %name%
label-occupied-foreground = ${colors.secondary}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
click-right = pavucontrol
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.purple}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "   "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "   "
format-prefix-foreground = ${colors.green}
label = %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 15
thermal-zone = 0
format-warn = <label-warn>
label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.red}
zone-type = x86_pkg_temp
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input
base-temperature = 20
warn-temperature = 80

[module/wireless-network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 60
click-right = networkmanager-applet
label-connected = "󰤨 "
label-disconnected = "󰤭 "
label-disconnected-foreground = ${colors.red}
label-connected-foreground = ${colors.teal}

[module/date]
type = internal/date
interval = 60

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
