[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
foreground-alt = #a9b1d6

primary = #7aa2f7
secondary = #bb9af7
accent = #565f89

red = #f7768e
orange = #ff9e64
yellow = #e0af68
green = #9ece6a
cyan = #7dcfff
blue = #7aa2f7
purple = #bb9af7
teal = #73daca

disabled = #565f89
border = #3b4261

[bar/bar]
width = 100%
height = 22pt
radius = 6
; dpi = 96

background = ${colors.background-alt}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 1

separator = 
separator-foreground = ${colors.background-alt}
font-0 = Iosevka Nerd Font;2

modules-left = i3 fs-home xwindow 
modules-center = date
modules-right = filesystem pulseaudio xkeyboard memory cpu temperature wireless-network
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 12pt

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
[fs-base]
type = internal/fs
fixed-values = true
label-mounted = 󰝰  %used%

[module/fs-home]
inherit = fs-base
mount-0 = /home

[module/pulseaudio]
type = internal/pulseaudio
click-right = pavucontrol
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.purple}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%% %gb_used%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.green}
label = %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 15
thermal-zone = 0
label-foreground = ${colors.yellow}
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
format-warn = <label-warn>
label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.red}
zone-type = x86_pkg_temp
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input
base-temperature = 20
warn-temperature = 80

[module/wireless-network]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 60
accumulate-stats = true
speed-unit = ''
udspeed-minwidth = 5
label-connected = "󰤨  "
label-disconnected = "󰤭 "
label-disconnected-foreground = ${colors.red}
label-connected-foreground = ${colors.teal}

[module/date]
type = internal/date
interval = 60
format-prefix = "   "
format-prefix-foreground = ${colors.orange}
date = %d-%m-%Y %H:%M
date-alt = %H:%M
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = true
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.border} 
label-focused = %index%
label-focused-foreground = ${colors.background} 
label-focused-background = ${colors.disabled} 
label-focused-underline = ${colors.purple}
label-focused-padding = 1
label-visible = %index%
label-visible-underline = ${colors.green}
label-visible-padding = 4
label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.orange}
lable-urgent-underline = ${colors.red}
label-urgent-padding = 1
label-separator = |
label-separator-padding = 0
label-separator-foreground =  ${colors.background-alt}
fuzzy-match = true
